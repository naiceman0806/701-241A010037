<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 23 - Đèn Kéo Quân</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .stage {
            width: 100%;
            max-width: 600px;
            height: 380px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .lantern {
            width: 180px;
            height: 220px;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 15s infinite linear;
        }
        .lantern.paused {
            animation-play-state: paused;
        }
        .face {
            position: absolute;
            width: 180px;
            height: 220px;
            border: 3px solid rgba(255, 215, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.6);
        }
        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(160px); }
        .face:nth-child(2) { transform: rotateY(60deg) translateZ(160px); }
        .face:nth-child(3) { transform: rotateY(120deg) translateZ(160px); }
        .face:nth-child(4) { transform: rotateY(180deg) translateZ(160px); }
        .face:nth-child(5) { transform: rotateY(240deg) translateZ(160px); }
        .face:nth-child(6) { transform: rotateY(300deg) translateZ(160px); }
        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Bài Tập 23 - Đèn Kéo Quân</div>
        <nav>
            <ul>
                <li><a href="index.html">Trang Chủ</a></li>
                <li><a href="about.html">Lý Thuyết</a></li>
                <li><a href="contact.html">Điểm Danh</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="card" style="text-align: center;">
            <h2>Hiệu Ứng Đèn Kéo Quân 3D</h2>
            <p>Phạm Nguyễn Nhật Anh - 241A010037</p>
            <div class="stage">
                <div class="lantern" id="lantern">
                    <div class="face"><img src="https://picsum.photos/id/1015/300/400" alt="Hinh 1"></div>
                    <div class="face"><img src="https://picsum.photos/id/1025/300/400" alt="Hinh 2"></div>
                    <div class="face"><img src="https://picsum.photos/id/1035/300/400" alt="Hinh 3"></div>
                    <div class="face"><img src="https://picsum.photos/id/1045/300/400" alt="Hinh 4"></div>
                    <div class="face"><img src="https://picsum.photos/id/1055/300/400" alt="Hinh 5"></div>
                    <div class="face"><img src="https://picsum.photos/id/1065/300/400" alt="Hinh 6"></div>
                </div>
            </div>
            <p style="margin-top: 15px; color: #666;">Chạm hoặc rê chuột vào đèn để dừng chuyển động.</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Phạm Nguyễn Nhật Anh - 241A010037</p>
    </footer>
    <script>
        const lantern = document.getElementById('lantern');
        lantern.addEventListener('mouseenter', () => lantern.classList.add('paused'));
        lantern.addEventListener('mouseleave', () => lantern.classList.remove('paused'));
        lantern.addEventListener('touchstart', () => lantern.classList.add('paused'), { passive: true });
        lantern.addEventListener('touchend', () => lantern.classList.remove('paused'), { passive: true });
    </script>
</body>
</html>
